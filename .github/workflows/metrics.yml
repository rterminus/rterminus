name: Metrics
on:
  push: {branches: ["master", "main"]}
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rterminus
          template: classic
          base: header, activity, repositories, metadata
          config_timezone: America/Sao_Paulo
          
          plugin_calendar: yes
          plugin_calendar_limit: 1
          
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_ignored: dotfiles
          
          config_padding: 5
          config_display: compact
          
          extras_css: |
            * { font-family: monospace !important; }
            .field { color: #9f9f9f !important; }
            .field-name { color: #ffffff !important; }
            .field-value { color: #ffffff !important; }
            .calendar .day.level-0 { fill: #1a1a1a !important; }
            .calendar .day.level-1 { fill: #4a4a4a !important; }
            .calendar .day.level-2 { fill: #6a6a6a !important; }
            .calendar .day.level-3 { fill: #8a8a8a !important; }
            .calendar .day.level-4 { fill: #aaaaaa !important; }
            .stat { color: #ffffff !important; }
            .stat .number { color: #ffffff !important; }
