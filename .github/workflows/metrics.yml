name: Metrics
on:
  push: {branches: ["master", "main"]}
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - name: Install Iosevka font
        run: |
          wget https://github.com/be5invis/Iosevka/releases/latest/download/ttf-iosevka.zip -O /tmp/iosevka.zip
          sudo mkdir -p /usr/share/fonts/truetype/iosevka
          sudo unzip /tmp/iosevka.zip -d /usr/share/fonts/truetype/iosevka/
          sudo fc-cache -fv
        
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rterminus
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_habits: yes
          plugin_habits_facts: yes
          extras_css: |
            * { font-family: 'Iosevka', monospace !important; }
